---
# yamllint disable rule:line-length
name: Check that README files are updated when specs change
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      requested:
        description: Run this workflow for an authorized /citest command
        required: true
        type: boolean
permissions:
  contents: read
  pull-requests: read
  # This is required for the ability to create/update the Pull request status
  statuses: write
jobs:
  check_docs:
    if: inputs.requested || github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
      statuses: write
    steps:
      - name: Get PR head SHA and context
        if: github.event_name == 'issue_comment'
        id: head_sha_context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CONTEXT: "${{ github.workflow }} / ${{ github.job }} (pull_request)"
        run: |
          set -euxo pipefail
          head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"

      - name: Set commit status as pending
        if: github.event_name == 'issue_comment'
        uses: linux-system-roles/.github/github-actions/commit-status@main
        with:
          sha: ${{ steps.head_sha_context.outputs.head_sha }}
          status: pending
          context: ${{ steps.head_sha_context.outputs.context }}
          description: Test started
          targetUrl: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}

      - name: Update pip, git
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install -y git

      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.head_sha_context.outputs.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0

      - name: Install tox and tox-lsr
        run: |
          set -euxo pipefail
          pip install tox
          pip install "git+https://github.com/linux-system-roles/tox-lsr@b30596c6fd1863b2eed20206ef32d13eac478e18"

      - name: Build documentation from argument_specs
        run: tox -e build-docs

      - name: Check whether README files are up to date
        run: |
          set -euo pipefail
          # Fail if the generated docs are not tracked - otherwise an untracked
          # README.html would not show up in the diff and the check would
          # silently pass while the committed docs are missing or stale.
          if ! git ls-files --error-unmatch README.md README.html >/dev/null 2>&1; then
            echo "README.md and/or README.html is not tracked in git"
            echo "Run 'tox -e build-docs' locally and commit both files."
            exit 1
          fi
          if git diff --exit-code README.md README.html; then
            echo "README files are up-to-date"
          else
            echo "README files are out-of-date"
            echo "meta/argument_specs.yml or meta/extra_specs.yml was modified,"
            echo "but README.md and/or README.html were not regenerated."
            echo "Run 'tox -e build-docs' locally and commit the changes."
            echo "For instructions on how to install tox-lsr, see:"
            echo "  https://github.com/linux-system-roles/tox-lsr"
            exit 1
          fi

      - name: Set final commit status
        if: always() && github.event_name == 'issue_comment' && steps.head_sha_context.outputs.head_sha != ''
        uses: linux-system-roles/.github/github-actions/commit-status@main
        with:
          sha: ${{ steps.head_sha_context.outputs.head_sha }}
          status: ${{ job.status }}
          context: ${{ steps.head_sha_context.outputs.context }}
          description: Test finished
          targetUrl: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
